name: Build Bethel Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    name: Compile Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Bethel project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install compatible Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      # This project's source distribution did not contain customized native
      # Android files. Remove any outdated generated shell from the repo so
      # `flutter create` actually refreshes Gradle/AGP/Kotlin together.
      - name: Regenerate Android project with compatible Gradle
        run: |
          rm -rf android
          flutter create --platforms=android --org org.bethelopenbible --project-name bethel_open_bible_church .
          echo "--- Generated Gradle wrapper ---"
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "--- Generated Gradle plugin versions ---"
          grep -E 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle.kts || true

      - name: Install packages
        run: flutter pub get

      - name: Apply church app name and icon
        run: |
          dart run tool/configure_android.dart
          dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bethel-Open-Bible-Church-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
